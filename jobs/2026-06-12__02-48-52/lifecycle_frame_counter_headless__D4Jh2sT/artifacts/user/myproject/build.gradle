plugins {
    id 'java'
}

// Ensure Java source files are compiled as UTF-8 so Javadoc unicode chars
// in comments don't trip up javac's default platform encoding.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    // Desktop natives required so HeadlessApplication can load libgdx64.so at runtime.
    implementation 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

// Resolve source sets so the classpath is available for the run task
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

/**
 * JavaExec task named 'run' per the requirements.
 * Pass the frame count via: ./gradlew run --args="<N>"
 * Gradle's built-in --args support for JavaExec splits the string and forwards
 * each token as a separate program argument.
 */
tasks.register('run', JavaExec) {
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.Main'

    // Wire stdout/stderr so that -q (quiet) Gradle mode still streams program output.
    standardOutput = System.out
    errorOutput    = System.err
}
