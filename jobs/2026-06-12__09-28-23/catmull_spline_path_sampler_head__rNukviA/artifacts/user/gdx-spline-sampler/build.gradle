plugins {
    id 'java'
    id 'application'
}

group = 'com.example.spline'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

application {
    mainClassName = 'com.example.spline.Main'
}

run {
    // Allow --args to pass arguments through
    if (project.hasProperty('args')) {
        args project.args.split('\\s+')
    }
}
