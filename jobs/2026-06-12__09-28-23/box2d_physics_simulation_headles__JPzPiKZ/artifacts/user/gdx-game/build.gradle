plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-backend-headless:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:1.14.2:natives-desktop"
}

application {
    mainClass = 'com.gdx.game.Main'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
