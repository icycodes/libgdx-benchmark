// server module — headless launcher and main entry point.
apply plugin: 'application'

mainClassName = 'com.matchreplay.server.ServerApp'

application {
    mainClass = 'com.matchreplay.server.ServerApp'
}

dependencies {
    implementation project(':core')

    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-headless:1.14.2'
    runtimeOnly     'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
}

// Allow passing --args to the run task.
run {
    if (project.hasProperty('appArgs')) {
        args Eval.me(appArgs)
    }
}
